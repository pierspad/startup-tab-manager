<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Tab Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="options.css">
    <link rel="icon" type="image/png" href="icons/icon-48.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Startup Tab Manager</h1>
            <p class="subtitle">Configure windows and tabs to restore automatically on browser startup</p>
        </header>

        <main id="windows-container">
            <!-- Windows and their tab sections dynamically rendered here -->
        </main>

        <section class="global-actions-container">
            <button id="add-window-btn" class="action-btn primary" title="Add another window to restore on startup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                    <line x1="9" y1="10" x2="15" y2="10"></line>
                    <line x1="12" y1="7" x2="12" y2="13"></line>
                </svg>
                Add New Window
            </button>
            <button id="import-all-btn" class="action-btn secondary" title="Capture all currently open Firefox windows and their tabs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Import All Open Windows
            </button>
        </section>

        <section class="settings-container">
            <label class="checkbox-label" for="close-others-checkbox">
                <input type="checkbox" id="close-others-checkbox">
                <span class="custom-checkbox">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </span>
                <span class="label-text">Close other tabs (unlisted) in primary window on startup</span>
            </label>
        </section>

        <footer class="app-footer">
            <div class="footer-left">
                <a href="https://addons.mozilla.org/it/firefox/addon/startup-tab-manager/" target="_blank" rel="noopener noreferrer" class="footer-addon-link" title="Startup Tab Manager on Firefox Add-ons">
                    <img src="icons/icon-48.png" alt="Startup Tab Manager" class="footer-addon-icon">
                </a>
                <div class="footer-line">
                    <a href="https://github.com/pierspad/startup-tab-manager/releases" target="_blank" rel="noopener noreferrer" class="footer-version" title="View Releases on GitHub">v1.0.2</a>
                    <a href="https://github.com/pierspad/startup-tab-manager/blob/main/docs/LICENSE" target="_blank" rel="noopener noreferrer" class="footer-badge" title="View GPL-3.0 License">GPL-3.0</a>
                    <span class="footer-separator">•</span>
                    <a href="https://pierspad.com" target="_blank" rel="noopener noreferrer" class="footer-author-link" title="Visit pierspad.com">
                        <span>by Pierpaolo Spadafora</span>
                        <img src="icons/avatar.png" alt="Pierpaolo Spadafora" class="footer-propic">
                    </a>
                </div>
            </div>
            <div class="footer-right">
                <a href="https://ko-fi.com/pierspad" target="_blank" rel="noopener noreferrer" class="footer-link sponsor-link" title="Support development on Ko-fi">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span>SPONSOR</span>
                </a>
                <a href="https://github.com/pierspad/startup-tab-manager" target="_blank" rel="noopener noreferrer" class="footer-link" title="Open GitHub Repository">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    <span>GITHUB REPO</span>
                </a>
            </div>
        </footer>
    </div>

    <div id="notification" class="notification" role="status" aria-live="polite">Saved!</div>
    <script src="utils.js"></script>
    <script src="options.js"></script>
</body>
</html>
