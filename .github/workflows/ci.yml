name: CI (Test & Lint)

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test & Dry Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Checks (web-ext lint & tests)
        run: npm run check

      - name: Verify Build
        run: npm run build

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: startup-tab-manager-build
          path: web-ext-artifacts/*.zip
          retention-days: 7
