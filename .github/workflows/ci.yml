name: CI (Test & Lint)

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Lint, Test & Dry Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Checks (web-ext lint & tests)
        run: npm run check

      - name: Verify Build
        run: npm run build
